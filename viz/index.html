<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waiter robot 3D</title>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d25; --panel-2: #232733; --line: #313645;
    --text: #e9eaee; --muted: #9aa0ae; --blue: #2a78d6; --orange: #eb6834;
    --green: #3fb37f; --red: #e0565b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", "Leelawadee UI", sans-serif; }
  #app { display: flex; height: 100%; }
  #panel { width: 360px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    padding: 18px 18px 24px; overflow-y: auto; }
  #view { position: relative; flex: 1; min-width: 0; }
  #view canvas { display: block; }
  h1 { font-size: 19px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 14px; font-size: 12.5px; }
  #tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 14px; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 8px; cursor: pointer; }
  button:hover { border-color: #4a5266; }
  button.on { background: #2d3a55; border-color: var(--blue); }
  .group { margin: 10px 0; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 5px; }
  .row { display: flex; gap: 5px; flex-wrap: wrap; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; margin-top: 12px; }
  .card p { margin: 4px 0; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .yes { background: rgba(63,179,127,.18); color: var(--green); }
  .no { background: rgba(224,86,91,.18); color: var(--red); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .answer { white-space: pre-wrap; font-size: 13px; background: #161920; border-radius: 6px; padding: 8px; margin-top: 6px; max-height: 190px; overflow: auto; }
  code { font-family: Consolas, monospace; font-size: 12.5px; color: #c9d4ff; }
  #hud { position: absolute; left: 14px; top: 12px; background: rgba(18,20,26,.78); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; pointer-events: none; }
  #tip { position: absolute; pointer-events: none; background: rgba(18,20,26,.9); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 7px; font-size: 12px; display: none; }
  #bubble { position: absolute; max-width: 260px; background: #f4f1ea; color: #1b1b1b; border-radius: 10px;
    padding: 7px 10px; font-size: 12.5px; transform: translate(-50%, -100%); pointer-events: none; display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
    border: 7px solid transparent; border-top-color: #f4f1ea; border-bottom: 0; }
  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #panel { width: 100%; max-height: 46%; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
<script src="data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Waiter robot</h1>
    <p class="sub">Topic 7 · Q table (Q-learning) + LLM agent · data from <code>uv run export-viz</code></p>
    <nav id="tabs">
      <button data-mode="route">Route</button>
      <button data-mode="policy">Policy</button>
      <button data-mode="agent">Agent</button>
      <button data-mode="compare">Compare α</button>
    </nav>
    <section id="controls"></section>
    <section id="info"></section>
  </aside>
  <main id="view">
    <div id="hud"></div>
    <div id="tip"></div>
    <div id="bubble"></div>
  </main>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const D = window.VIZ_DATA;
const ROWS = D.map.length, COLS = D.map[0].length;
const PLACES = Object.fromEntries(D.places.map(p => [p.letter, p]));
const LETTERS = D.places.map(p => p.letter);
const ARROW_DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];  // action -> (dx, dz): up, right, down, left
const TABLE_COLOR = { "0.5": 0x2a78d6, "0.1": 0xeb6834 };
const SPEED = 4.2;  // cells per second

const x = c => c - (COLS - 1) / 2;
const z = r => r - (ROWS - 1) / 2;
const key = (r, c) => `${r},${c}`;
const cellAt = (r, c) => D.map[r][c];
const isFree = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS && !"#~".includes(cellAt(r, c));

// ---------- scene ----------
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12141a);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0.5, 9.5, 8.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0.3);
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 5; controls.maxDistance = 22;
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xfff4e6, 0x30343f, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-4, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 6, bottom: -6 });
scene.add(sun);

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...extra });
const box = (w, h, d, m) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.castShadow = o.receiveShadow = true; return o; };
const cyl = (rt, rb, h, m, seg = 24) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); o.castShadow = o.receiveShadow = true; return o; };

function label(text, bg = "rgba(20,22,30,.88)") {
  const cv = document.createElement("canvas"); cv.width = 320; cv.height = 72;
  const g = cv.getContext("2d");
  g.fillStyle = bg; g.beginPath(); g.roundRect(4, 4, 312, 64, 18); g.fill();
  g.fillStyle = "#fff"; g.font = "600 30px system-ui, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, 160, 37);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  s.scale.set(1.75, 0.39, 1); s.renderOrder = 10;
  return s;
}

// floor, one tile per cell (the tiles are also the click targets)
const tiles = [];
const floorA = mat(0xd9c7a7), floorB = mat(0xcdb894), floorDanger = mat(0x5a3a33);
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const ch = cellAt(r, c);
  const m = ch === "~" ? floorDanger : ((r + c) % 2 ? floorA : floorB);
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.06, 0.98), m);
  t.position.set(x(c), -0.03, z(r)); t.receiveShadow = true;
  t.userData = { r, c, ch };
  scene.add(t); tiles.push(t);
}
const base = box(COLS + 0.5, 0.12, ROWS + 0.5, mat(0x2a2e39));
base.position.y = -0.12; scene.add(base);

// low walls
const wallM = mat(0x8c6f55);
for (const [w, d, px, pz] of [[COLS + 0.5, 0.12, 0, -(ROWS / 2 + 0.19)], [COLS + 0.5, 0.12, 0, ROWS / 2 + 0.19],
                              [0.12, ROWS + 0.5, -(COLS / 2 + 0.19), 0], [0.12, ROWS + 0.5, COLS / 2 + 0.19, 0]]) {
  const wl = box(w, 0.35, d, wallM); wl.position.set(px, 0.12, pz); scene.add(wl);
}

// restaurant tables (obstacles)
const cloth = mat(0xf2ede4), wood = mat(0x6b4a33), plateM = mat(0xffffff, { roughness: 0.4 });
function makeTable(r, c) {
  const g = new THREE.Group();
  const top = cyl(0.4, 0.4, 0.06, cloth, 32); top.position.y = 0.62; g.add(top);
  const leg = cyl(0.05, 0.07, 0.6, wood); leg.position.y = 0.31; g.add(leg);
  const foot = cyl(0.22, 0.24, 0.04, wood); foot.position.y = 0.02; g.add(foot);
  for (const a of [0.6, 3.7]) {
    const p = cyl(0.1, 0.08, 0.02, plateM); p.position.set(Math.cos(a) * 0.2, 0.66, Math.sin(a) * 0.2); g.add(p);
    const ch = box(0.2, 0.05, 0.2, wood); ch.position.set(Math.cos(a) * 0.36, 0.3, Math.sin(a) * 0.36); g.add(ch);  // inside the table's cell
  }
  g.position.set(x(c), 0, z(r)); scene.add(g);
}

// fryer area (danger)
const steel = mat(0xa9adb5, { metalness: 0.7, roughness: 0.35 });
const oil = new THREE.MeshStandardMaterial({ color: 0xffa531, emissive: 0xff6a00, emissiveIntensity: 0.9, roughness: 0.2 });
const fryerOils = [];
function makeFryer(r, c) {
  const g = new THREE.Group();
  const body = box(0.86, 0.8, 0.86, steel); body.position.y = 0.4; g.add(body);
  const o = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.02, 0.66), oil.clone()); o.position.y = 0.81; g.add(o); fryerOils.push(o);
  const basket = box(0.3, 0.12, 0.3, mat(0x555a63, { metalness: 0.6 })); basket.position.set(0.12, 0.86, 0.1); g.add(basket);
  g.position.set(x(c), 0, z(r)); scene.add(g);
}
const fryerLight = new THREE.PointLight(0xff7a1a, 2.2, 3.5);
scene.add(fryerLight);

// places
const PLACE_COLOR = { K: 0x3fb37f, B: 0xb36ad6, T: 0x2fa6c9 };
function makePlace(p) {
  const g = new THREE.Group();
  const pad = cyl(0.44, 0.44, 0.03, mat(PLACE_COLOR[p.letter], { emissive: PLACE_COLOR[p.letter], emissiveIntensity: 0.35 }), 40);
  pad.position.y = 0.015; g.add(pad);
  if (p.letter === "K") {  // kitchen pass with plates
    const counter = box(0.9, 0.55, 0.22, mat(0xe8e8e8)); counter.position.set(0, 0.28, -0.42); g.add(counter);
    for (let i = -1; i <= 1; i++) { const pl = cyl(0.1, 0.08, 0.03, plateM); pl.position.set(i * 0.27, 0.57, -0.42); g.add(pl); }
  } else if (p.letter === "B") {  // bar counter with bottles
    const counter = box(0.22, 0.6, 0.9, mat(0x5a3b2a)); counter.position.set(0.42, 0.3, 0); g.add(counter);
    for (let i = -1; i <= 1; i++) {
      const bt = cyl(0.04, 0.05, 0.22, mat([0x2e7d4f, 0x8a2b2b, 0xc9a227][i + 1], { roughness: 0.3 }));
      bt.position.set(0.42, 0.71, i * 0.25); g.add(bt);
    }
  } else {  // terrace door frame
    const fm = mat(0x3a6b4d);
    const l = box(0.08, 0.95, 0.08, fm); l.position.set(-0.38, 0.47, 0.44); g.add(l);
    const rr = box(0.08, 0.95, 0.08, fm); rr.position.set(0.38, 0.47, 0.44); g.add(rr);
    const tp = box(0.84, 0.08, 0.08, fm); tp.position.set(0, 0.95, 0.44); g.add(tp);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.68, 0.86), new THREE.MeshStandardMaterial({ color: 0x9fd7ef, transparent: true, opacity: 0.35 }));
    glass.position.set(0, 0.47, 0.44); g.add(glass);
  }
  const lb = label(`${p.letter} · ${p.name}`); lb.position.y = 1.35; g.add(lb);
  g.position.set(x(p.col), 0, z(p.row)); scene.add(g);
}

let fx = 0, fz = 0, nf = 0;
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const ch = cellAt(r, c);
  if (ch === "#") makeTable(r, c);
  else if (ch === "~") { makeFryer(r, c); fx += x(c); fz += z(r); nf++; }
}
fryerLight.position.set(fx / nf, 1.3, fz / nf);
D.places.forEach(makePlace);

// ---------- robots ----------
function makeRobot(accent) {
  const g = new THREE.Group();
  const white = mat(0xf3f4f6, { roughness: 0.45 }), dark = mat(0x2b2f3a), acc = mat(accent, { emissive: accent, emissiveIntensity: 0.25 });
  const wheel = cyl(0.26, 0.28, 0.1, dark); wheel.position.y = 0.06; g.add(wheel);
  const body = cyl(0.2, 0.25, 0.5, white); body.position.y = 0.36; g.add(body);
  const band = cyl(0.205, 0.205, 0.06, acc); band.position.y = 0.42; g.add(band);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 24, 16), white); head.position.y = 0.72; head.castShadow = true; g.add(head);
  const visor = box(0.22, 0.06, 0.08, mat(0x11141b, { emissive: accent, emissiveIntensity: 0.6 })); visor.position.set(0, 0.74, 0.14); g.add(visor);
  const arm = box(0.05, 0.05, 0.3, white); arm.position.set(0.2, 0.55, 0.14); g.add(arm);
  const tray = cyl(0.16, 0.16, 0.02, mat(0xb8bcc6, { metalness: 0.6, roughness: 0.3 })); tray.position.set(0.2, 0.6, 0.28); g.add(tray);
  const dish = cyl(0.1, 0.07, 0.04, plateM); dish.position.set(0.2, 0.63, 0.28); g.add(dish);
  const food = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), mat(0xd9822b)); food.position.set(0.2, 0.67, 0.28); g.add(food);
  g.userData.head = head;
  scene.add(g);
  return g;
}
const robotA = makeRobot(TABLE_COLOR["0.5"]);
const robotB = makeRobot(TABLE_COLOR["0.1"]);

class Runner {
  constructor(robot, path, offset = 0) {
    Object.assign(this, { robot, path, offset, seg: 0, t: 0, done: path.length < 2 });
    robot.visible = true;
    this.pose(0);
    if (path.length > 1) robot.rotation.y = Math.atan2(path[1][1] - path[0][1], path[1][0] - path[0][0]);
  }
  pose(t) {
    const a = this.path[this.seg], b = this.path[Math.min(this.seg + 1, this.path.length - 1)];
    this.robot.position.set(x(a[1] + (b[1] - a[1]) * t) + this.offset, 0.03 * Math.abs(Math.sin(performance.now() / 120)), z(a[0] + (b[0] - a[0]) * t));
    if (a[0] !== b[0] || a[1] !== b[1]) {
      const target = Math.atan2(b[1] - a[1], b[0] - a[0]);
      let d = target - this.robot.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
      this.robot.rotation.y += d * 0.25;
    }
  }
  update(dt) {
    if (this.done) { this.robot.position.y = 0; return; }
    this.t += dt * SPEED;
    while (this.t >= 1) {
      this.t -= 1; this.seg++;
      if (this.seg >= this.path.length - 1) { this.seg = this.path.length - 1; this.t = 0; this.done = true; break; }
    }
    this.pose(this.done ? 0 : this.t);
  }
  get step() { return this.seg; }
}

// trails and arrows
const overlay = new THREE.Group(); scene.add(overlay);
function clearOverlay() { while (overlay.children.length) { const o = overlay.children.pop(); o.geometry?.dispose(); } }
function trail(path, color, offset = 0) {
  const pts = path.map(([r, c]) => new THREE.Vector3(x(c) + offset, 0.045, z(r)));
  const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, "catmullrom", 0.01), pts.length * 6, 0.035, 8),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 }));
  overlay.add(tube);
}
function marker(r, c, color) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.42, 40), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(x(c), 0.05, z(r)); overlay.add(ring);
}
function arrows(alpha, dest) {
  const pol = D.tables[alpha].policy[dest], col = TABLE_COLOR[alpha];
  for (const [k, a] of Object.entries(pol)) {
    const [r, c] = k.split(",").map(Number);
    const [dx, dz] = ARROW_DIRS[a];
    const dir = new THREE.Vector3(dx, 0, dz);
    const origin = new THREE.Vector3(x(c) - dx * 0.28, 0.12, z(r) - dz * 0.28);
    overlay.add(new THREE.ArrowHelper(dir, origin, 0.56, col, 0.22, 0.17));
  }
}

// hover marker
const hover = new THREE.Mesh(new THREE.RingGeometry(0.36, 0.46, 40), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
hover.rotation.x = -Math.PI / 2; hover.visible = false; scene.add(hover);

// ---------- state and UI ----------
const S = { mode: "route", dest: "T", alpha: "0.5", start: [0, 0], cmpDest: "K", cmpStart: [0, 8], caseN: 1, runners: [], bubble: null };
const $ = id => document.getElementById(id);
const controlsEl = $("controls"), infoEl = $("info"), hud = $("hud"), tip = $("tip"), bubble = $("bubble");

function btns(items, current, attr) {
  return `<div class="row">${items.map(([v, txt]) => `<button data-${attr}="${v}" class="${String(v) === String(current) ? "on" : ""}">${txt}</button>`).join("")}</div>`;
}
const destButtons = cur => btns(LETTERS.map(l => [l, `${l} · ${PLACES[l].name}`]), cur, "dest");
const alphaButtons = cur => btns([["0.5", "α = 0.5 (q_table.npy)"], ["0.1", "α = 0.1"]], cur, "alpha");
const badge = ok => `<span class="badge ${ok ? "yes" : "no"}">${ok ? "yes" : "no"}</span>`;
const esc = s => String(s).replace(/[&<>]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[ch]);

function invalidStart(r, c, dest) {
  const ch = cellAt(r, c);
  if (ch === "#") return `start (${r}, ${c}) is a table; the robot cannot stand there`;
  if (ch === "~") return `start (${r}, ${c}) is in the fryer area (danger); the robot cannot stand there`;
  if (ch === dest) return `start (${r}, ${c}) is already the destination ${dest} (${PLACES[dest].name})`;
  return null;
}

function routeCard(route, dest, start, alpha) {
  const bfs = D.bfs[dest][key(...start)];
  return `<div class="kv">
    <span>table</span><span><span class="dot" style="background:#${TABLE_COLOR[alpha].toString(16)}"></span>α = ${alpha}</span>
    <span>reached</span><span>${badge(route.reached)}</span>
    <span>steps</span><span><b>${route.steps}</b> (BFS shortest: ${bfs})</span>
    <span>return</span><span>${route.return.toFixed(1)}</span>
    <span>shortest</span><span>${badge(route.shortest)}</span></div>`;
}

function setRunners(list) { S.runners = list; robotA.visible = list.some(r => r.robot === robotA); robotB.visible = list.some(r => r.robot === robotB); }

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.mode === S.mode));
  clearOverlay(); S.bubble = null; bubble.style.display = "none";
  if (S.mode === "route") renderRoute();
  else if (S.mode === "policy") renderPolicy();
  else if (S.mode === "agent") renderAgent();
  else renderCompare();
}

function renderRoute(err) {
  controlsEl.innerHTML = `<div class="group"><div class="label">Destination</div>${destButtons(S.dest)}</div>
    <div class="group"><div class="label">Q table</div>${alphaButtons(S.alpha)}</div>
    <p class="hint">Click a free floor cell to set the robot's start. Same result as <code>run_policy(row, col, "${S.dest}")</code>.</p>`;
  const [r, c] = S.start;
  const bad = invalidStart(r, c, S.dest);
  if (bad || err) {
    infoEl.innerHTML = `<div class="card"><p><b>ValueError</b></p><p><code>${esc(err || bad)}</code></p></div>`;
    setRunners([]); hud.textContent = `start (${r}, ${c})`; return;
  }
  const route = D.tables[S.alpha].routes[S.dest][key(r, c)];
  const goal = PLACES[S.dest];
  trail(route.path, TABLE_COLOR[S.alpha]); marker(goal.row, goal.col, 0xffffff);
  setRunners([new Runner(robotA, route.path)]);
  infoEl.innerHTML = `<div class="card"><p><code>run_policy(${r}, ${c}, "${S.dest}")</code></p>${routeCard(route, S.dest, S.start, S.alpha)}
    <p style="margin-top:10px"><button id="replay">Replay</button></p></div>`;
  $("replay").onclick = () => renderRoute();
}

function renderPolicy() {
  controlsEl.innerHTML = `<div class="group"><div class="label">Destination</div>${destButtons(S.dest)}</div>
    <div class="group"><div class="label">Q table</div>${alphaButtons(S.alpha)}</div>
    <p class="hint">Each arrow is <code>best_action</code> in that cell when the robot heads to ${PLACES[S.dest].name}.</p>`;
  arrows(S.alpha, S.dest);
  const p = PLACES[S.dest]; marker(p.row, p.col, 0xffffff);
  setRunners([]);
  const t = D.tables[S.alpha];
  infoEl.innerHTML = `<div class="card"><div class="kv">
    <span>table</span><span>α = ${S.alpha}, ${D.episodes} episodes</span>
    <span>shortest routes</span><span><b>${t.shortest}/${D.pairs}</b> pairs (all destinations)</span></div></div>`;
  hud.textContent = `policy towards ${S.dest} · α = ${S.alpha}`;
}

function renderAgent() {
  controlsEl.innerHTML = `<div class="group"><div class="label">Case (real model, final attempt)</div>
    ${btns(D.cases.map(c => [c.n, `Case ${c.n}`]), S.caseN, "case")}</div>`;
  const cs = D.cases[S.caseN - 1];
  const called = cs.calls.length ? cs.calls.map(t => `<code>${t.name}(${Object.values(t.args).map(v => typeof v === "string" ? `"${v}"` : v).join(", ")})</code>`).join(", ") : "none";
  const thai = /[฀-๿]/.test(cs.answer);
  infoEl.innerHTML = `<div class="card">
    <p><b>"${esc(cs.request)}"</b></p>
    <div class="kv" style="margin-top:8px"><span>expected</span><span><code>${esc(cs.expected)}</code></span>
    <span>called</span><span>${called}</span>
    <span>meets</span><span>${badge(cs.meets)}</span></div>
    <div class="label" style="margin-top:10px">Answer</div><div class="answer">${esc(cs.answer)}</div>
    ${thai ? `<p class="hint">The model answered in Thai, writing out the procedure instead of calling the tools.</p>` : ""}</div>`;
  if (cs.run_policy) {
    trail(cs.run_policy.path, TABLE_COLOR["0.5"]);
    setRunners([new Runner(robotA, cs.run_policy.path)]);
    const end = cs.run_policy.path.at(-1); marker(end[0], end[1], 0xffffff);
    hud.textContent = `run_policy: ${cs.run_policy.steps} steps, return ${cs.run_policy.return}`;
  } else {
    const k = PLACES.K; setRunners([new Runner(robotA, [[k.row, k.col]])]);
    hud.textContent = "no run_policy call: the robot does not move";
  }
  S.bubble = cs.answer.length > 150 ? cs.answer.slice(0, 150) + "…" : cs.answer;
}

function renderCompare(err) {
  controlsEl.innerHTML = `<div class="group"><div class="label">Destination</div>${destButtons(S.cmpDest)}</div>
    <p class="hint">Click a free floor cell to set the start. Both tables run from the same cell.</p>`;
  const [r, c] = S.cmpStart;
  const bad = err || invalidStart(r, c, S.cmpDest);
  if (bad) { infoEl.innerHTML = `<div class="card"><p><b>ValueError</b></p><p><code>${esc(bad)}</code></p></div>`; setRunners([]); return; }
  const ra = D.tables["0.5"].routes[S.cmpDest][key(r, c)], rb = D.tables["0.1"].routes[S.cmpDest][key(r, c)];
  trail(ra.path, TABLE_COLOR["0.5"], -0.14); trail(rb.path, TABLE_COLOR["0.1"], 0.14);
  const p = PLACES[S.cmpDest]; marker(p.row, p.col, 0xffffff);
  setRunners([new Runner(robotA, ra.path, -0.14), new Runner(robotB, rb.path, 0.14)]);
  infoEl.innerHTML = `<div class="card">${routeCard(ra, S.cmpDest, S.cmpStart, "0.5")}</div>
    <div class="card">${routeCard(rb, S.cmpDest, S.cmpStart, "0.1")}</div>
    <p style="margin-top:10px"><button id="replay">Replay</button></p>`;
  $("replay").onclick = () => renderCompare();
}

document.getElementById("tabs").onclick = e => { const m = e.target.dataset?.mode; if (m) { S.mode = m; render(); } };
document.getElementById("panel").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.dest) { if (S.mode === "compare") S.cmpDest = b.dataset.dest; else S.dest = b.dataset.dest; render(); }
  if (b.dataset.alpha) { S.alpha = b.dataset.alpha; render(); }
  if (b.dataset.case) { S.caseN = Number(b.dataset.case); render(); }
});

// picking cells
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function pick(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(tiles, false)[0];
  return hit ? hit.object.userData : null;
}
let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;  // a drag, not a click
  const cell = pick(e); if (!cell) return;
  if (S.mode === "route") { S.start = [cell.r, cell.c]; render(); }
  else if (S.mode === "compare") { S.cmpStart = [cell.r, cell.c]; render(); }
});
renderer.domElement.addEventListener("pointermove", e => {
  const cell = (S.mode === "route" || S.mode === "compare") ? pick(e) : null;
  if (!cell) { hover.visible = false; tip.style.display = "none"; return; }
  hover.visible = true; hover.position.set(x(cell.c), 0.06, z(cell.r));
  const what = { "#": "table", "~": "fryer area", ".": "free" }[cell.ch] || `${cell.ch} · ${PLACES[cell.ch].name}`;
  const rect = view.getBoundingClientRect();
  tip.style.display = "block"; tip.style.left = `${e.clientX - rect.left + 14}px`; tip.style.top = `${e.clientY - rect.top + 10}px`;
  tip.textContent = `(${cell.r}, ${cell.c}) · ${what}`;
});

// ---------- loop ----------
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px";
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  S.runners.forEach(r => r.update(dt));
  if ((S.mode === "route" || S.mode === "compare") && S.runners.length) {
    hud.textContent = S.runners.map(r => `${r.robot === robotA ? "α 0.5" : "α 0.1"}: step ${r.step}/${r.path.length - 1}`).join(" · ");
  }
  const flick = 0.75 + 0.25 * Math.sin(performance.now() / 180);
  fryerOils.forEach((o, i) => { o.material.emissiveIntensity = flick + 0.1 * Math.sin(i + performance.now() / 90); });
  fryerLight.intensity = 1.8 + 0.6 * flick;
  if (S.bubble && robotA.visible) {
    robotA.userData.head.getWorldPosition(tmp); tmp.y += 0.3; tmp.project(camera);
    bubble.style.display = "block"; bubble.textContent = S.bubble;
    bubble.style.left = `${(tmp.x + 1) / 2 * view.clientWidth}px`; bubble.style.top = `${(1 - tmp.y) / 2 * view.clientHeight}px`;
  }
  controls.update();
  renderer.render(scene, camera);
});

const fromHash = location.hash.slice(1);  // e.g. index.html#compare opens that mode
if (["route", "policy", "agent", "compare"].includes(fromHash)) S.mode = fromHash;
render();
</script>
</body>
</html>
